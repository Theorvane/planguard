name: PlanGuard BYO-AI Terraform Review

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "**/*.tf"
      - "**/*.tfvars"

permissions:
  contents: read

jobs:
  explain-plan:
    # Do not expose an AI API secret to code submitted from a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      # Configure your cloud identity here, preferably through OIDC. Terraform needs it to create a plan.
      # Do not pass cloud credentials to the PlanGuard Action.
      - name: Explain the Terraform plan with your AI provider
        uses: sjungwon03/planguard/actions/ai-review@c0e9897478a0f4f10294d68a83ecf2a4edaddbd0 # BYO-AI action security fix
        with:
          api-key: ${{ secrets.PLANGUARD_AI_API_KEY }}
          model: gpt-4.1-mini
          # For another OpenAI-compatible provider, change api-url and keep the key in a GitHub secret.
          # api-url: https://provider.example/v1/chat/completions
          working-directory: infrastructure
