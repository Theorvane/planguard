name: PlanGuard BYO-AI Terraform Review

# Secure default: runs only on the repository's trusted default branch. It does not execute
# unreviewed pull-request Terraform with a cloud identity or any model API key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-sanitized-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      # Configure an environment-protected, short-lived, plan-only cloud identity here. This job
      # checks out the trusted default branch only; never add pull_request or pull_request_target.
      - uses: Theorvane/planguard/actions/prepare-ai-review@60da2380a1b94b045362bbede5e30343301dd765
        with:
          working-directory: infrastructure
          output-path: planguard-sanitized-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planguard-sanitized-plan
          path: planguard-sanitized-plan.json
          if-no-files-found: error
          retention-days: 1

  explain-plan:
    needs: prepare-sanitized-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: planguard-sanitized-plan
          path: plan-artifact
      - uses: Theorvane/planguard/actions/ai-review@60da2380a1b94b045362bbede5e30343301dd765
        with:
          api-key: ${{ secrets.PLANGUARD_AI_API_KEY }}
          model: gpt-4.1-mini
          plan-json-path: plan-artifact/planguard-sanitized-plan.json
          # api-url: https://your-provider.example/v1/chat/completions
