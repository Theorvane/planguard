name: PlanGuard BYO-AI Explanation
description: Explain a sanitized Terraform plan with your OpenAI-compatible AI provider.
branding:
  icon: shield
  color: purple
inputs:
  api-key:
    description: Your OpenAI-compatible provider API key. Pass this from a GitHub Actions secret.
    required: true
  model:
    description: Model identifier accepted by the provider.
    required: true
  plan-json-path:
    description: Path to a Terraform plan JSON that was sanitized in a separate trusted job.
    required: true
  api-url:
    description: HTTPS OpenAI-compatible chat-completions endpoint.
    required: false
    default: https://api.openai.com/v1/chat/completions
runs:
  using: composite
  steps:
    - name: Generate explanation from sanitized plan
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PLAN_JSON_PATH: ${{ inputs.plan-json-path }}
        INPUT_API_URL: ${{ inputs.api-url }}
      run: ${{ github.action_path }}/actions/ai-review/scripts/explain.sh
