name: PlanGuard BYO-AI Terraform Review
description: Create a local Terraform plan, redact Terraform-marked sensitive values, and ask your OpenAI-compatible model to explain it.
inputs:
  api-key:
    description: API key from a GitHub Actions secret. It is never written to logs, outputs, or summaries.
    required: true
  model:
    description: OpenAI-compatible chat model identifier.
    required: true
  api-url:
    description: HTTPS OpenAI-compatible chat-completions endpoint.
    required: false
    default: https://api.openai.com/v1/chat/completions
  working-directory:
    description: Directory containing Terraform configuration.
    required: false
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      run: ${{ github.action_path }}/scripts/analyze.sh
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
