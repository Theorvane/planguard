name: release-promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-promotion:
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Require the repository-owned dev branch
        shell: bash
        run: |
          test "$HEAD_REF" = "dev"
